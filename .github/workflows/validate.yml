name: Validate marketplace

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/apm-action@176186397bcf6d997b4ef8d3433bfb3db37fe630 # v1
        with:
          setup-only: true
          apm-version: 0.27.0
      - name: Validate marketplace and skills
        run: bash scripts/validate.sh
